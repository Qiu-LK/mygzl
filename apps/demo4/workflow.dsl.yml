    - data:
        code: "import json\n\n\ndef to_object(value):\n    if isinstance(value, str):\n\
          \        return json.loads(value)\n    return value\n\n\ndef main(ocr_results,\
          \ ocr_pages, page_count):\n    try:\n        ocr_results = to_object(ocr_results)\n\
          \        ocr_pages = to_object(ocr_pages)\n\n        if isinstance(ocr_results,\
          \ dict):\n            ocr_results = (\n                ocr_results.get(\"\
          output\")\n                or ocr_results.get(\"result\")\n            \
          \    or []\n            )\n\n        if not isinstance(ocr_results, list):\n\
          \            raise ValueError(\"OCR结果不是数组\")\n\n        if not isinstance(ocr_pages,\
          \ list):\n            raise ValueError(\"ocr_pages不是数组\")\n\n        expected_pages\
          \ = set()\n        for page in ocr_pages:\n            if type(page) is\
          \ not int:\n                raise ValueError(f\"无效OCR页码：{page}\")\n    \
          \        if page < 1 or page > page_count:\n                raise ValueError(f\"\
          OCR页码超出范围：{page}\")\n            expected_pages.add(page)\n\n        page_map\
          \ = {}\n        duplicate_pages = []\n        image_count = 0\n\n      \
          \  for task in ocr_results:\n            if not isinstance(task, dict):\n\
          \                raise ValueError(\"某个OCR任务结果不是对象\")\n\n            source_pages\
          \ = task.get(\"source_pages\")\n            if not isinstance(source_pages,\
          \ list) or not source_pages:\n                raise ValueError(\"OCR任务缺少\
          \ source_pages\")\n\n            raw_json = task.get(\"ocr_json\")\n   \
          \         raw_json = to_object(raw_json)\n\n            if not isinstance(raw_json,\
          \ list):\n                raise ValueError(\"ocr_json不是数组\")\n\n       \
          \     pages = []\n\n            for block in raw_json:\n               \
          \ if isinstance(block, dict):\n                    block_pages = block.get(\"\
          pages\")\n                    if isinstance(block_pages, list):\n      \
          \                  pages.extend(block_pages)\n\n            if len(pages)\
          \ != len(source_pages):\n                raise ValueError(\n           \
          \         f\"任务 {task.get('task_id')} 页数不一致：\"\n                    f\"\
          source_pages={len(source_pages)}，识别结果={len(pages)}\"\n                )\n\
          \n            for index, page_data in enumerate(pages):\n              \
          \  source_page = source_pages[index]\n\n                if source_page in\
          \ page_map:\n                    duplicate_pages.append(source_page)\n\n\
          \                if not isinstance(page_data, dict):\n                 \
          \   raise ValueError(f\"第 {source_page} 页结果不是对象\")\n\n                text\
          \ = page_data.get(\"markdown_text\", \"\")\n                if not isinstance(text,\
          \ str):\n                    text = str(text or \"\")\n\n              \
          \  images = page_data.get(\"markdown_images\") or {}\n                if\
          \ not isinstance(images, dict):\n                    images = {}\n\n   \
          \             # 将相对图片路径替换为OCR服务返回的图片地址\n                for image_key, image_url\
          \ in images.items():\n                    if not isinstance(image_key, str):\n\
          \                        continue\n                    if not isinstance(image_url,\
          \ str):\n                        continue\n\n                    text =\
          \ text.replace(\n                        f'src=\"{image_key}\"',\n     \
          \                   f'src=\"{image_url}\"'\n                    )\n    \
          \                text = text.replace(\n                        f\"src='{image_key}'\"\
          ,\n                        f\"src='{image_url}'\"\n                    )\n\
          \n                image_urls = [\n                    url for url in images.values()\n\
          \                    if isinstance(url, str)\n                ]\n\n    \
          \            image_count += len(image_urls)\n\n                page_map[source_page]\
          \ = {\n                    \"page_no\": source_page,\n                 \
          \   \"text\": text.strip(),\n                    \"has_images\": len(image_urls)\
          \ > 0,\n                    \"image_count\": len(image_urls),\n        \
          \            \"image_urls\": image_urls\n                }\n\n        actual_pages\
          \ = set(page_map.keys())\n\n        missing_pages = sorted(expected_pages\
          \ - actual_pages)\n        unexpected_pages = sorted(actual_pages - expected_pages)\n\
          \        duplicate_pages = sorted(set(duplicate_pages))\n\n        coverage_ok\
          \ = not (\n            missing_pages\n            or duplicate_pages\n \
          \           or unexpected_pages\n        )\n\n        ordered_records =\
          \ [\n            page_map[page_no]\n            for page_no in sorted(page_map.keys())\n\
          \        ]\n\n        merged_text = \"\\n\\n\".join(\n            record[\"\
          text\"]\n            for record in ordered_records\n            if record[\"\
          text\"]\n        )\n\n        error = \"\"\n        if not coverage_ok:\n\
          \            error = (\n                f\"页码覆盖异常：缺失={missing_pages}，\"\n\
          \                f\"重复={duplicate_pages}，\"\n                f\"多出={unexpected_pages}\"\
          \n            )\n\n        return {\n            \"merged_text\": merged_text,\n\
          \            \"page_records\": ordered_records,\n            \"coverage_ok\"\
          : coverage_ok,\n            \"missing_pages\": missing_pages,\n        \
          \    \"duplicate_pages\": duplicate_pages,\n            \"unexpected_pages\"\
          : unexpected_pages,\n            \"image_count\": image_count,\n       \
          \     \"error\": error\n        }\n\n    except Exception as e:\n      \
          \  return {\n            \"merged_text\": \"\",\n            \"page_records\"\
          : [],\n            \"coverage_ok\": False,\n            \"missing_pages\"\
          : [],\n            \"duplicate_pages\": [],\n            \"unexpected_pages\"\
          : [],\n            \"image_count\": 0,\n            \"error\": str(e)\n\
          \        }"
        code_language: python3
        outputs:
          coverage_ok:
            children: null
            type: boolean
          duplicate_pages:
            children: null
            type: array[number]
          error:
            children: null
            type: string
          image_count:
            children: null
            type: number
          merged_text:
            children: null
            type: string
          missing_pages:
            children: null
