    - data:
        code: "def main(text_pages):\n    if not isinstance(text_pages, list):\n \
          \       raise ValueError(\"text_pages必须是数组\")\n\n    pages = []\n\n    for\
          \ page in text_pages:\n        if type(page) is not int or page < 1:\n \
          \           raise ValueError(f\"无效文字页码：{page}\")\n        pages.append(page)\n\
          \n    pages = sorted(set(pages))\n    ranges = []\n    index = 0\n\n   \
          \ while index < len(pages):\n        start = pages[index]\n        end =\
          \ start\n\n        while (\n            index + 1 < len(pages)\n       \
          \     and pages[index + 1] == end + 1\n        ):\n            index +=\
          \ 1\n            end = pages[index]\n\n        if start == end:\n      \
          \      ranges.append(str(start))\n        else:\n            ranges.append(f\"\
          {start}-{end}\")\n\n        index += 1\n\n    return {\n        \"page_ranges\"\
          : \",\".join(ranges),\n        \"selected_pages\": pages,\n        \"needs_extract\"\
          : len(pages) > 0\n    }"
        code_language: python3
        outputs:
          needs_extract:
            children: null
            type: boolean
          page_ranges:
            children: null
            type: string
          selected_pages:
            children: null
            type: array[number]
        selected: false
        title: 原生文字任务规划
        type: code
        variables:
        - value_selector:
