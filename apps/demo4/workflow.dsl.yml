    - data:
        code: "def main(task_id, source_pages, ocr_text, ocr_json):\n    if not isinstance(ocr_text,\
          \ str) or not ocr_text.strip():\n        raise ValueError(\n           \
          \ f\"OCR任务 {task_id} 未返回有效正文，请检查识别结果\"\n        )\n\n    if not isinstance(source_pages,\
          \ list) or not source_pages:\n        raise ValueError(\"缺少原始页面列表\")\n\n\
          \    return {\n        \"result\": {\n            \"task_id\": task_id,\n\
          \            \"source_pages\": source_pages,\n            \"text\": ocr_text.strip(),\n\
          \            \"ocr_json\": ocr_json\n        }\n    }"
        code_language: python3
        isInIteration: true
        isInLoop: false
        iteration_id: '1791642231218'
        outputs:
          result:
            children: null
            type: object
        selected: false
        title: OCR结果打包
        type: code
        variables:
