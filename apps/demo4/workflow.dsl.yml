    - data:
        code: "def main(native_result, ocr_pages, page_count, skip_pages):\n    if\
          \ native_result is None:\n        native_result = {}\n\n    if ocr_pages\
          \ is None:\n        ocr_pages = []\n\n    if not isinstance(native_result,\
          \ dict):\n        raise ValueError(\"native_result必须是对象\")\n\n    if not\
          \ isinstance(ocr_pages, list):\n        raise ValueError(\"ocr_pages必须是数组\"\
          )\n\n    native_pages = (\n        native_result.get(\"page_records\")\n\
          \        or native_result.get(\"pages\")\n        or []\n    )\n\n    all_pages\
          \ = []\n    duplicate_pages = []\n    seen = set()\n\n    for page in native_pages\
          \ + ocr_pages:\n        if not isinstance(page, dict):\n            continue\n\
          \n        page_no = page.get(\"page_no\")\n\n        if not isinstance(page_no,\
          \ int):\n            continue\n\n        if page_no in seen:\n         \
          \   duplicate_pages.append(page_no)\n            continue\n\n        seen.add(page_no)\n\
          \        all_pages.append(page)\n\n    all_pages.sort(key=lambda item: item[\"\
          page_no\"])\n\n    merged_text_parts = []\n    text_pages = []\n    ocr_page_numbers\
          \ = []\n\n    for page in all_pages:\n        text = (page.get(\"text\"\
          ) or \"\").strip()\n\n        if text:\n            merged_text_parts.append(text)\n\
          \            text_pages.append(page[\"page_no\"])\n\n        if page.get(\"\
          source_type\") in (\"scan\", \"ocr\"):\n            ocr_page_numbers.append(page[\"\
          page_no\"])\n\n    total_pages = int(page_count or 0)\n    actual_pages\
          \ = [page[\"page_no\"] for page in all_pages]\n\n    skipped = set(skip_pages\
          \ or [])\n\n    missing_pages = [\n        page_no for page_no in range(1,\
          \ total_pages + 1)\n        if page_no not in actual_pages\n        and\
          \ page_no not in skipped\n    ]\n\n    return {\n        \"result\": {\n\
          \            \"page_count\": total_pages,\n            \"pages\": all_pages,\n\
          \            \"page_records\": all_pages,\n            \"merged_text\":\
          \ \"\\n\\n\".join(merged_text_parts),\n            \"text_pages\": text_pages,\n\
          \            \"ocr_pages\": sorted(set(ocr_page_numbers)),\n           \
          \ \"missing_pages\": missing_pages,\n            \"duplicate_pages\": sorted(set(duplicate_pages)),\n\
          \            \"coverage_ok\": (\n                len(missing_pages) == 0\n\
          \                and len(duplicate_pages) == 0\n            )\n        }\n\
          \    }"
