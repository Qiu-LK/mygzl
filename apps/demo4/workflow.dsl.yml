    - data:
        code: "import json\n\n\ndef main(merged_result, target_consumers='', Main_reading_needs=''):\n\
          \    if not isinstance(merged_result, dict) or merged_result.get('coverage_ok')\
          \ is not True:\n        raise ValueError('页面覆盖检查未通过，不能识别文档画像')\n    records\
          \ = merged_result.get('page_records') or merged_result.get('pages') or []\n\
          \    pages = []\n    for record in records:\n        if not isinstance(record,\
          \ dict):\n            continue\n        text = str(record.get('text') or\
          \ '').strip()\n        if text:\n            pages.append((record.get('page_no'),\
          \ text))\n    if not pages:\n        text = str(merged_result.get('merged_text')\
          \ or '').strip()\n        if text:\n            pages = [(None, text)]\n\
          \    if not pages:\n        raise ValueError('正文为空，无法识别文档画像')\n    # Cover\
          \ plus spread-out body samples; no full-book second model pass.\n    indices\
          \ = sorted(set([0, 1 if len(pages) > 1 else 0] +\n                     \
          \    [round((len(pages) - 1) * fraction / 4) for fraction in range(1, 5)]))\n\
          \    samples = []\n    for index in indices:\n        number, text = pages[index]\n\
          \        excerpt = text if len(text) <= 1200 else text[:850] + '\\n[中间省略，仅用于识别]\\\
          n' + text[-300:]\n        samples.append({'page_no': number, 'excerpt':\
          \ excerpt})\n    payload = {'user_target_consumers': str(target_consumers\
          \ or '')[:1200],\n               'user_reading_needs': str(Main_reading_needs\
          \ or '')[:1600],\n               'document_samples': samples}\n    return\
          \ {'sample_json': json.dumps(payload, ensure_ascii=False),\n           \
          \ 'sampled_pages': [p['page_no'] for p in samples if type(p['page_no'])\
          \ is int],\n            'sample_chars': sum(len(p['excerpt']) for p in samples)}\n"
        code_language: python3
        outputs:
          sample_chars:
            children: null
            type: number
          sample_json:
            children: null
            type: string
          sampled_pages:
            children: null
            type: array[number]
