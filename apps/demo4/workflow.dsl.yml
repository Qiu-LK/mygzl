    - data:
        code: "import json\nimport re\nimport math\n\n\ndef clean_string(value, limit=500):\n\
          \    return value.strip()[:limit] if isinstance(value, str) else ''\n\n\n\
          def parse_profile(raw):\n    if isinstance(raw, dict):\n        return raw\n\
          \    if not isinstance(raw, str) or len(raw) > 16000:\n        return {}\n\
          \    text = raw.strip()\n    if text.startswith('```'):\n        text =\
          \ re.sub(r'^```(?:json)?\\s*', '', text, flags=re.I)\n        text = re.sub(r'\\\
          s*```$', '', text)\n    try:\n        data = json.loads(text)\n    except\
          \ (TypeError, ValueError):\n        # Accommodate a preamble, but never\
          \ evaluate Python or partial JSON.\n        begin, end = text.find('{'),\
          \ text.rfind('}')\n        if begin < 0 or end <= begin:\n            return\
          \ {}\n        try:\n            data = json.loads(text[begin:end + 1])\n\
          \        except (TypeError, ValueError):\n            return {}\n    return\
          \ data if isinstance(data, dict) else {}\n\n\ndef main(raw_profile, sample_json,\
          \ target_consumers='', Main_reading_needs=''):\n    data = parse_profile(raw_profile)\n\
          \    try:\n        sample = json.loads(sample_json)\n    except (TypeError,\
          \ ValueError):\n        sample = {}\n    samples = sample.get('document_samples',\
          \ []) if isinstance(sample, dict) else []\n    excerpts = [item['excerpt']\
          \ for item in samples\n                if isinstance(item, dict) and isinstance(item.get('excerpt'),\
          \ str)]\n    joined = '\\n'.join(excerpts)\n    target = str(target_consumers\
          \ or '').strip()\n    needs = str(Main_reading_needs or '').strip()\n  \
          \  warnings = []\n    if not data:\n        warnings.append('辅助识别未返回可用JSON，已使用用户设置及保守默认值')\n\
          \    raw_evidence = data.get('evidence', [])\n    evidence = []\n    if\
          \ isinstance(raw_evidence, list):\n        for value in raw_evidence[:5]:\n\
          \            value = clean_string(value, 160)\n            if value and\
          \ any(value in excerpt for excerpt in excerpts):\n                evidence.append(value)\n\
          \    try:\n        confidence = float(data.get('confidence', 0))\n     \
          \   confidence = max(0.0, min(1.0, confidence)) if math.isfinite(confidence)\
          \ else 0.0\n    except (TypeError, ValueError, OverflowError):\n       \
          \ confidence = 0.0\n    # Confidence is a model estimate, not a measured\
          \ correctness probability.\n    reliable = bool(evidence) and confidence\
          \ >= 0.6\n    inferred_target = clean_string(data.get('inferred_target_consumers'))\n\
          \    inferred_needs = clean_string(data.get('inferred_reading_needs'), 900)\n\
          \    grade = re.search(r'(?:小学|初中|高中)?[一二三四五六七八九十]+年级', joined)\n    rule_target\
          \ = (grade.group(0) + '学生') if grade else ''\n    if target:\n        effective_target,\
          \ target_source = target, 'user'\n    elif reliable and inferred_target:\n\
          \        effective_target, target_source = inferred_target, 'document_inference'\n\
          \    elif rule_target:\n        effective_target, target_source = rule_target,\
          \ 'explicit_document_label'\n    else:\n        effective_target, target_source\
          \ = '普通成人读者；专业背景未知，采用低门槛表达', 'default'\n    paired_study = '早背' in joined\
          \ and any(word in joined for word in ('晚默', '填空', '自测'))\n    if needs:\n\
          \        effective_needs, needs_source = needs, 'user'\n    elif paired_study:\n\
          \        effective_needs, needs_source = '保留早背晚默结构；背诵清楚准确；填空保留横线，不填答案、不删除练习',\
          \ 'explicit_document_structure'\n    elif reliable and inferred_needs:\n\
          \        effective_needs, needs_source = inferred_needs, 'document_inference'\n\
          \    else:\n        effective_needs, needs_source = '保留重要信息、编号、数字及单位，改善表达；不虚构或无价值扩写',\
          \ 'default'\n    allowed_types = {'study_workbook', 'textbook', 'manual',\
          \ 'professional_notes',\n                     'report', 'general_document',\
          \ 'unknown'}\n    doc_type = data.get('document_type') if reliable else\
          \ None\n    if doc_type not in allowed_types:\n        doc_type = 'study_workbook'\
          \ if paired_study else 'unknown'\n    if not reliable:\n        warnings.append('样本依据不足或模型自评较低；未采用无依据的年龄、专业背景和版式推断')\n\
          \    risk = data.get('risk_level')\n    if risk not in ('low', 'medium',\
          \ 'high', 'unknown'):\n        risk = 'unknown'\n    risk_terms = [word\
          \ for word in ('剂量', '处方', '服药', '用药', '投资', '法律责任', '高压', '易燃') if word\
          \ in joined]\n    if risk_terms:\n        risk = 'high'\n        warnings.append('样本命中高风险词：'\
          \ + '、'.join(risk_terms) + '；不代表专业安全审核')\n    elif not reliable:\n     \
          \   risk = 'unknown'\n    explicit = bool(target)\n    profile = {\n   \
          \     'document_type': doc_type,\n        'subject': clean_string(data.get('subject'))\
          \ if reliable else '未确定',\n        'inferred_target_consumers': inferred_target\
          \ if reliable else rule_target,\n        'effective_target_consumers': effective_target,\n\
          \        'target_source': target_source,\n        'effective_reading_needs':\
          \ effective_needs,\n        'reading_needs_source': needs_source,\n    \
          \    # A model's document audience cannot override an explicitly requested\
          \ audience.\n        'age_band': clean_string(data.get('age_band')) if reliable\
          \ and not explicit else '未确定；以用户读者设置为准' if explicit else '未确定',\n      \
          \  'reading_level': '按用户指定读者适配：' + target if explicit else clean_string(data.get('reading_level'))\
          \ if reliable else effective_target,\n        'prior_knowledge': clean_string(data.get('prior_knowledge'))\
          \ if reliable and not explicit else '未确定，不预设专业知识',\n        'tone': clean_string(data.get('tone'))\
          \ if reliable and not explicit else '清楚、自然；按有效读者设置调整',\n        'layout_style':\
          \ clean_string(data.get('layout_style'), 700) if reliable and not explicit\
          \ else '清晰层级、舒适单栏；按用户读者和阅读需求适配',\n        'risk_level': risk,\n        'confidence':\
          \ confidence,\n        'confidence_note': '模型自评，不是准确率；样本识别不代表全文质量或安全审核',\n\
          \        'evidence': evidence,\n        'warnings': warnings,\n    }\n \
          \   return {'profile': profile, 'profile_json': json.dumps(profile, ensure_ascii=False),\n\
          \            'effective_target_consumers': effective_target,\n         \
          \   'effective_reading_needs': effective_needs}\n"
        code_language: python3
