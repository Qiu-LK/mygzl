    - data:
        code: "import re\n\n\n# 不跨越下一个figure，避免残缺图吞掉后面的完整图。\nFIGURE_RE = re.compile(\n\
          \    r\"<figure\\b[^>]*>\"\n    r\"(?:(?!<figure\\b|</figure\\s*>)[\\s\\\
          S])*\"\n    r\"</figure\\s*>\",\n    re.I\n)\n\nSVG_RE = re.compile(\n \
          \   r\"<svg\\b[^>]*>[\\s\\S]*?</svg\\s*>\",\n    re.I\n)\n\nCAPTION_RE =\
          \ re.compile(\n    r\"<figcaption\\b[^>]*>[\\s\\S]*?</figcaption\\s*>\"\
          ,\n    re.I\n)\n\n\ndef main(results):\n    # 整体输入绑定错误仍需提示，不能掩盖配置问题。\n \
          \   if not isinstance(results, list):\n        raise ValueError(\"results应绑定迭代3的output数组\"\
          )\n\n    parts = []\n\n    for item in results:\n        # 空输出、None或异常单项直接跳过。\n\
          \        if not isinstance(item, str) or not item.strip():\n           \
          \ continue\n\n        text = item.strip()\n\n        # 兼容旧版默认输出，不把占位文字传给后续节点。\n\
          \        if re.fullmatch(r\"无需额外图解[。.!！]?\", text):\n            continue\n\
          \n        # 仅保留figure本体，去掉外围说明和代码围栏。\n        for match in FIGURE_RE.finditer(text):\n\
          \            figure = match.group(0).strip()\n\n            # 每幅图应有且仅有一个完整SVG。\n\
          \            if len(re.findall(r\"<svg\\b\", figure, re.I)) != 1:\n    \
          \            continue\n\n            if len(re.findall(r\"</svg\\s*>\",\
          \ figure, re.I)) != 1:\n                continue\n\n            if not SVG_RE.search(figure):\n\
          \                continue\n\n            # 每幅图应有且仅有一个完整图注。\n           \
          \ if len(re.findall(r\"<figcaption\\b\", figure, re.I)) != 1:\n        \
          \        continue\n\n            if len(re.findall(\n                r\"\
          </figcaption\\s*>\", figure, re.I\n            )) != 1:\n              \
          \  continue\n\n            if not CAPTION_RE.search(figure):\n         \
          \       continue\n\n            # 单项不合格只跳过该幅，不影响其他图。\n            parts.append(figure)\n\
          \n    return {\n        \"text\": \"\\n\\n\".join(parts),\n        \"diagram_count\"\
          : len(parts)\n    }"
