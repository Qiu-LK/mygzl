    - data:
        code: "def main(ocr_pages, page_count):\n    if type(page_count) is not int\
          \ or page_count < 1:\n        raise ValueError(\"PDF总页数必须为正整数\")\n\n   \
          \ if not isinstance(ocr_pages, list):\n        raise ValueError(\"ocr_pages必须为数组\"\
          )\n\n    for page in ocr_pages:\n        if type(page) is not int or not\
          \ 1 <= page <= page_count:\n            raise ValueError(f\"无效的OCR页码：{page}\"\
          )\n\n    if len(ocr_pages) != len(set(ocr_pages)):\n        raise ValueError(\"\
          OCR页码存在重复\")\n\n    pages = sorted(ocr_pages)\n    tasks = []\n    batch\
          \ = []\n\n    def add_task(source_pages):\n        start = source_pages[0]\n\
          \        end = source_pages[-1]\n        page_range = str(start) if start\
          \ == end else f\"{start}-{end}\"\n\n        tasks.append({\n           \
          \ \"task_id\": len(tasks) + 1,\n            \"page_range\": page_range,\n\
          \            \"source_pages\": source_pages.copy()\n        })\n\n    for\
          \ page in pages:\n        # 每批最多4页；遇到不连续页码就另建任务\n        if batch and (len(batch)\
          \ >= 4 or page != batch[-1] + 1):\n            add_task(batch)\n       \
          \     batch = []\n\n        batch.append(page)\n\n    if batch:\n      \
          \  add_task(batch)\n\n    return {\n        \"ocr_tasks\": tasks,\n    \
          \    \"task_count\": len(tasks)\n    }"
        code_language: python3
