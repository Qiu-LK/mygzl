          human_description:
            en_US: Specifies the geometric representation mode for layout detection
              results. It defines how the boundaries of detected regions (e.g., text
              blocks, images, tables) are calculated and displayed. "Rectangle" corresponds
              to an axis-aligned bounding box (x1, y1, x2, y2) and is suitable for
              standard horizontally laid-out pages; "Quadrilateral" corresponds to
              an arbitrary four-sided shape defined by four vertices and is suitable
              for regions with skew or perspective distortion; "Polygon" corresponds
              to a closed contour defined by multiple coordinate points and is suitable
              for irregularly shaped or curved layout elements, offering the highest
              precision; "Auto" indicates that the system automatically selects the
              most appropriate shape representation based on the complexity and confidence
              of the detected targets.
            ja_JP: Specifies the geometric representation mode for layout detection
              results. It defines how the boundaries of detected regions (e.g., text
              blocks, images, tables) are calculated and displayed. "Rectangle" corresponds
              to an axis-aligned bounding box (x1, y1, x2, y2) and is suitable for
              standard horizontally laid-out pages; "Quadrilateral" corresponds to
              an arbitrary four-sided shape defined by four vertices and is suitable
              for regions with skew or perspective distortion; "Polygon" corresponds
              to a closed contour defined by multiple coordinate points and is suitable
              for irregularly shaped or curved layout elements, offering the highest
              precision; "Auto" indicates that the system automatically selects the
              most appropriate shape representation based on the complexity and confidence
              of the detected targets.
            pt_BR: Specifies the geometric representation mode for layout detection
              results. It defines how the boundaries of detected regions (e.g., text
              blocks, images, tables) are calculated and displayed. "Rectangle" corresponds
              to an axis-aligned bounding box (x1, y1, x2, y2) and is suitable for
              standard horizontally laid-out pages; "Quadrilateral" corresponds to
              an arbitrary four-sided shape defined by four vertices and is suitable
              for regions with skew or perspective distortion; "Polygon" corresponds
              to a closed contour defined by multiple coordinate points and is suitable
              for irregularly shaped or curved layout elements, offering the highest
              precision; "Auto" indicates that the system automatically selects the
              most appropriate shape representation based on the complexity and confidence
              of the detected targets.
            zh_Hans: 用于指定版面检测结果的几何形状表示模式。该参数决定了检测区域（如文本块、图片、表格等）边界的计算方式及展示形态。“矩形”对应水平正向的边界框（包含
              x1, y1, x2, y2），适用于标准的水平排版版面；“四边形”对应由四个顶点组成的任意四边形，适用于存在倾斜、透视变形的区域；“多边形”对应由多个坐标点组成的闭合轮廓，适用于形状不规则或具有弧度的版面元素，精度最高；“自动”指示系统根据检测目标的复杂程度和置信度，自动选择最合适的形状表达方式。
