    - data:
        code: "import json\n\n\ndef main(status_code, body):\n    if int(status_code)\
          \ != 200:\n        raise ValueError(\n            f\"PDF预检失败，HTTP状态码：{status_code}\"\
          \n        )\n\n    data = json.loads(body) if isinstance(body, str) else\
          \ body\n\n    if not isinstance(data, dict):\n        raise ValueError(\"\
          PDF预检返回内容不是JSON对象\")\n\n    if data.get(\"error\"):\n        raise ValueError(str(data[\"\
          error\"]))\n\n    page_count = data.get(\"page_count\")\n    document_mode\
          \ = data.get(\"document_mode\")\n\n    if not isinstance(page_count, int)\
          \ or page_count < 1:\n        raise ValueError(\"预检结果缺少有效页数\")\n\n    if\
          \ document_mode not in (\"text\", \"scan\", \"mixed\"):\n        raise ValueError(\"\
          预检结果中的PDF类型无效\")\n\n    text_pages = data.get(\"text_pages\", [])\n    ocr_pages\
          \ = data.get(\"ocr_pages\", [])\n    skip_pages = data.get(\"skip_pages\"\
          , [])\n\n    for page_list in (text_pages, ocr_pages, skip_pages):\n   \
          \     if not isinstance(page_list, list):\n            raise ValueError(\"\
          页面列表格式错误\")\n\n        if any(\n            not isinstance(p, int) or p\
          \ < 1 or p > page_count\n            for p in page_list\n        ):\n  \
          \          raise ValueError(\"页面列表包含无效页码\")\n\n    all_pages = text_pages\
          \ + ocr_pages + skip_pages\n\n    if sorted(all_pages) != list(range(1,\
          \ page_count + 1)):\n        raise ValueError(\"页面分类存在遗漏或重复\")\n\n    return\
          \ {\n        \"inspect_result\": data,\n        \"page_count\": page_count,\n\
          \        \"document_mode\": document_mode,\n        \"needs_ocr\": bool(ocr_pages),\n\
          \        \"text_pages\": text_pages,\n        \"ocr_pages\": ocr_pages,\n\
          \        \"skip_pages\": skip_pages\n    }"
        code_language: python3
