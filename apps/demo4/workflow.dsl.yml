    - data:
        code: "# Dify Python3：分页与SVG尺寸合并修复版（标准库，保留kbd兼容及正文校验）\n# 输入、输出名称与旧节点保持一致，不需要新增节点。\n\
          import json\nimport re\nimport math\nfrom html import escape\nfrom html.parser\
          \ import HTMLParser\n\n\nKEYBOARD_PAIR = re.compile(r'<kbd\\s*>([^<>]*?)</kbd\\\
          s*>', re.I)\n# 必须保护代码、原图/链接地址和HTML注释；不执行HTML，不解码实体。\nKEYBOARD_PROTECTED\
          \ = re.compile(\n    r'(?<!`)(`+)(?!`)(.*?)\\1(?!`)'\n    r'|!?\\[[^\\]\\\
          n]*\\]\\(https?://(?:[^()\\s]|\\([^()\\s]*\\))+\\)'\n    r'|https?://[^\\\
          s]+'\n    r'|\\$\\$.*?\\$\\$|(?<!\\$)\\$[^$\\n]+\\$(?!\\$)'\n    r'|<(?:pre|code)\\\
          b[^>]*>.*?</(?:pre|code)\\s*>'\n    r'|<!--.*?-->',\n    re.S\n)\n\n\ndef\
          \ normalize_keyboard_markup(source):\n    \"\"\"仅移除普通正文中完整kbd包装，原样保留键名及其他全部字符。\"\
          \"\"\n    converted = 0\n\n    def strip_pairs(value):\n        nonlocal\
          \ converted\n        # 支持标准的嵌套kbd；只有完整配对的kbd标签可以被去掉。\n        while True:\n\
          \            value, count = KEYBOARD_PAIR.subn(lambda match: match.group(1),\
          \ value)\n            converted += count\n            if not count:\n  \
          \              return value\n\n    def prose(value):\n        result, cursor\
          \ = [], 0\n        for match in KEYBOARD_PROTECTED.finditer(value):\n  \
          \          result.append(strip_pairs(value[cursor:match.start()]))\n   \
          \         result.append(match.group(0))\n            cursor = match.end()\n\
          \        result.append(strip_pairs(value[cursor:]))\n        return ''.join(result)\n\
          \n    result, pending, active_fence = [], [], None\n    # keepends避免为了处理标签改变原有换行或代码缩进。\n\
          \    for line in source.splitlines(keepends=True):\n        if active_fence:\n\
          \            result.append(line)\n            if fence_close(line.rstrip('\\\
          r\\n'), active_fence):\n                active_fence = None\n          \
          \  continue\n        opening = fence_open(line.rstrip('\\r\\n'))\n     \
          \   if opening:\n            result.append(prose(''.join(pending)))\n  \
          \          pending = []\n            active_fence = opening\n          \
          \  result.append(line)\n        elif line.startswith(('    ', '\\t')):\n\
          \            # 保守保留缩进代码，不因标签兼容改变编程示例。\n            result.append(prose(''.join(pending)))\n\
          \            pending = []\n            result.append(line)\n        else:\n\
          \            pending.append(line)\n    result.append(prose(''.join(pending)))\n\
          \    return ''.join(result), converted\n\n\n\ndef publication_inline(value):\n\
